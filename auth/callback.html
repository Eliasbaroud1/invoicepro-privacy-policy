<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InvoicePro — Email confirmed</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
         background:#f6f7fb;color:#111827;margin:0;padding:32px 16px;
         min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{background:#fff;border:1px solid #e9ecf3;border-radius:16px;
          padding:40px 32px;max-width:440px;width:100%;text-align:center;
          box-shadow:0 1px 3px rgba(17,24,39,.06)}
    .check{font-size:48px;line-height:1;margin-bottom:8px}
    h1{font-size:24px;font-weight:700;margin:8px 0 16px;letter-spacing:-.3px}
    p{color:#4b5563;line-height:1.6;margin:12px 0;font-size:15px}
    .button{display:inline-block;background:#111827;color:#fff;text-decoration:none;
            font-weight:600;padding:14px 28px;border-radius:10px;margin-top:8px;
            font-size:15px}
    .small{font-size:13px;color:#9ca3af;margin-top:24px}
    .brand{font-size:14px;color:#9ca3af;margin-bottom:8px;letter-spacing:.5px;
           text-transform:uppercase;font-weight:600}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">InvoicePro</div>
    <div class="check">✅</div>
    <h1>Email confirmed</h1>
    <p>Your account is verified. Tap the button to open InvoicePro and finish signing in.</p>
    <a id="openLink" class="button" href="#">Open InvoicePro</a>
    <p class="small">
      On a desktop or tablet? Just open InvoicePro on your phone and sign in normally —
      your account is now active.
    </p>
  </div>
  <script>
    var scheme = 'io.supabase.invoicepro://login-callback';
    var deepLink = scheme + (window.location.search || '') + (window.location.hash || '');
    document.getElementById('openLink').setAttribute('href', deepLink);
    if (/Android|iPhone|iPad/i.test(navigator.userAgent)) {
      setTimeout(function(){ window.location.href = deepLink; }, 200);
    }
  </script>
</body>
</html>
